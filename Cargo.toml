[package]
name = "alice-channel"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "LicenseRef-Proprietary"
publish = false
description = "Mutually authenticated, encrypted channels between certified devices: the Noise IK handshake (over a stream, or in datagrams) with each side's static key bound to its device certificate"
repository = "https://github.com/ext-sakamoro/ALICE-Channel"
authors = ["Moroya Sakamoto"]

[dependencies]
# X25519, SHA-256 / HMAC / HKDF and ChaCha20-Poly1305 (RFC 8439); the device certificate and the signer: taken by git from main like the other consumers, so a build with downstream consumers links one copy of each (the lock is the pin)
alice-crypto = { version = "0.7", git = "https://github.com/ext-sakamoro/ALICE-Crypto", branch = "main" }
alice-identity = { version = "3.0", git = "https://github.com/ext-sakamoro/ALICE-Identity", branch = "main" }
alice-sign = { version = "0.1", git = "https://github.com/ext-sakamoro/ALICE-Sign", branch = "main" }
zeroize = { version = "1", features = ["zeroize_derive"] }
# the async channel (feature `async`)
tokio = { version = "1", default-features = false, features = ["io-util", "time"], optional = true }

[features]
async = ["dep:tokio"]

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["io-util", "time", "rt", "rt-multi-thread", "macros", "sync"] }
