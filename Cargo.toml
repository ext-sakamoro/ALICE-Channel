[package]
name = "alice-channel"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "LicenseRef-Proprietary"
publish = false
description = "Mutually authenticated, encrypted channels between certified devices: the Noise IK handshake (over a stream, or in datagrams) with each side's static key bound to its device certificate"
repository = "https://github.com/ext-sakamoro/ALICE-Channel"
authors = ["Moroya Sakamoto"]

[dependencies]
# X25519, SHA-256 / HMAC / HKDF and ChaCha20-Poly1305 (RFC 8439), taken by git at a full commit
alice-crypto = { version = "0.6.0", git = "https://github.com/ext-sakamoro/ALICE-Crypto", rev = "7fd119db2215c01eeeab431bd32a01f9791356c6" }
alice-identity = { version = "1.2.0", git = "https://github.com/ext-sakamoro/ALICE-Identity", rev = "55be13728aef680ff9b3de56dcd234a578ee7db9" }
alice-sign = { version = "0.1", git = "https://github.com/ext-sakamoro/ALICE-Sign", rev = "bb79209e376ec3989bf721f48d5894032a221e8b" }
zeroize = { version = "1", features = ["zeroize_derive"] }
# the async channel (feature `async`)
tokio = { version = "1", default-features = false, features = ["io-util", "time"], optional = true }

[features]
async = ["dep:tokio"]

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["io-util", "time", "rt", "rt-multi-thread", "macros", "sync"] }
