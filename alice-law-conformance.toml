# ALICE-Law conformance manifest for this crate (alice-channel). One entry per
# gate defined in ALICE-Law's conformance/gates.toml; the schema (status /
# evidence / since / note / reference_repo) is the "Manifest" section of
# docs/CONFORMANCE.md in that repository.
#
# Every entry was written from a measurement on this repository at the commit
# this file is added on: the library and test suites were run (debug and
# release profile, default and async features), clippy was run with the
# crate's own configuration, and every `pass` carries a measured mutant; `n/a`
# (G7 to G9) is measured by scripts/law_boundary_scan.py. The crate has no
# floating-point arithmetic: the handshake and the transport are integer and
# byte operations (X25519, SHA-256 / HMAC / HKDF and ChaCha20-Poly1305 come from
# alice-crypto). What it puts on the wire for fixed keys is pinned by
# tests/semantics_golden.rs and folded into CHANNEL_SEMANTICS_ID.

